[project]
name = "pcbstudio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "websockets>=17.3",
]

[project.scripts]
pcbstudio = "pcbstudio:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
